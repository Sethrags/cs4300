{% extends 'bookings/base.html' %}
{% block title %}Create account | CineBook{% endblock %}
{% block content %}
  <div class="row justify-content-center"><div class="col-sm-9 col-md-6 col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body p-4">
    <h1 class="h3 mb-3">Create an account</h1>
    <p class="text-secondary">Create an account to reserve seats and review your bookings.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-dark w-100">Create account</button></form>
    <p class="small text-secondary mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
  </div></div></div></div>
{% endblock %}
