{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CineBook{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'bookings/css/site.css' %}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'movie-list' %}">CineBook</a>
      <div class="navbar-nav ms-auto align-items-lg-center">
        <a class="nav-link" href="{% url 'movie-list' %}">Movies</a>
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'booking-history' %}">My bookings</a>
          <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-link nav-link border-0">Log out</button></form>
        {% else %}
          <a class="nav-link" href="{% url 'login' %}">Log in</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-5">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="border-top py-4 text-center text-secondary small">CineBook - reserve your next great movie.</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
